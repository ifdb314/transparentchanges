name: Supabase keepalive

# Supabase free-tier projects auto-pause after a stretch of inactivity.
# This pings the database daily (comfortably under any inactivity window)
# with a trivial read so the project never goes quiet.

on:
  schedule:
    - cron: "17 6 * * *" # daily, arbitrary off-peak minute to avoid GitHub's on-the-hour cron congestion
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/founding_circle_entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase keepalive request failed."
            exit 1
          fi
